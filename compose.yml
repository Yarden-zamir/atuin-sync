services:
  server:
    # The fork image takes a full page of thread records in one upload (upstream answers 413).
    # Built from the `yarden` branch of github.com/Yarden-zamir/atuin. Update the digest by hand.
    image: ghcr.io/yarden-zamir/atuin-server:yarden@sha256:541d56876f3cc503aa0033cea40bf99662157b73fd0f873bf2dbe60d29fdb078
    command: ["start"]
    # /data starts owned by root; the deployment machine uses rootless Docker.
    user: "0:0"
    environment:
      ATUIN_HOST: "0.0.0.0"
      ATUIN_PORT: "8888"
      ATUIN_DB_URI: "sqlite:///data/atuin.db"
      ATUIN_OPEN_REGISTRATION: "${OPEN_REGISTRATION:-true}"
    volumes:
      - atuin-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8888/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  socket:
    image: alpine/socat:1.8.1.3@sha256:466c8a0383e16463fabdb7df01008292fb78d07da60224a46cb5d3142ce122ed
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        rm -f /sockets/default.sock
        exec socat UNIX-LISTEN:/sockets/default.sock,fork,mode=0666 TCP:server:8888
    volumes:
      - ${KITSHN_SOCKET_DIR:?kitshn supplies the socket directory}:/sockets
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  atuin-data:
